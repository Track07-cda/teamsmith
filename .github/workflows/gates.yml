name: gates

# The two commands the PM runs on every task branch before merging:
#
#   openspec validate --all --strict && bash skills/teamsmith/tests/smoke.sh
#
# They run inside the pinned gate image (ci/Containerfile) rather than on the runner directly.
# Why (M47): the suite asserts real behaviour of real tools (tmux bracketed paste, a login shell
# whose profile may drop the caller's PATH, a JS runtime, pi's own skill parser, the committed
# panel bundle's byte-for-byte rebuild). A rolling `ubuntu-latest` drifts under it — the first
# runner-only run of this workflow was ✓2300 ✗48, and every one of the 48 was environment
# (no pi, a different login profile, tmux 3.4 without `#{bracket_paste_flag}`, bun 1.4 vs the
# 1.3.14 that built the committed bundle, node not at /usr/bin/node, and Ink's `is-in-ci`
# treating the TTY pane as non-interactive). The image pins all of that; `docker build` +
# `docker run` is the whole CI environment.
#
# The container deliberately does NOT get `CI`/`GITHUB_*` injected: the gate must not depend on
# the caller's environment. The one environment-sensitive path we know of (Ink 7 rendering
# nothing when `CI` is set) is pinned by an explicit `CI=1` pane fixture in smoke 26-m, so it is
# covered on every machine, not only on runners.
#
# Manual + `main` only (no pull_request trigger): this repository may be private, and Actions
# minutes are billed — the PM's independent `team review <ID> --dir …` run stays the gate that
# decides a merge. This workflow is also the public repository's own signal: on a public repo
# Actions minutes are free, so a `push` run on `main` is worth having; add `pull_request` here if the
# project ever takes outside contributions.
#
# P130/A (D60 #1, after D54 records ~30 pushes burning the account's Actions quota): a push whose
# every changed file is under docs/** — the team ledger BOARD/DECISIONS/reports/reviews/threads —
# cannot change the gate's outcome, so it no longer pays for a run. GitHub skips the run only when
# *all* changed files match paths-ignore; one non-ignored file in the same push still triggers it.
# `workflow_dispatch` has no path filter and always runs. The trigger matrix, including the
# counterexamples that prove skills/**, openspec/**, ci/** and .github/** still trigger, lives in the
# project ledger's P130 report; the matrix itself is small enough to state here: a push touching only
# `docs/**` is ignored, and any of `skills/**`, `openspec/**`, `ci/**`, `.github/**`, `bin/**`,
# `install.sh`, `package.json`, `README.md` or `LICENSE` triggers a run.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: false

# P324：gate 步与收集步共用一个**显式**临时根。这里钉一个值，gate 步把它传给容器并在跑门禁之前建出来，
# 收集步拿同一个值当拷贝源 —— 两边不再各自猜一个路径。
env:
  TEAM_CI_TMP_ROOT: /var/tmp/teamsmith-ci-tmp

jobs:
  gates:
    runs-on: ubuntu-latest
    # The correctness suite takes ~10 minutes in the container and the image build a few; P130 moved
    # the perf suite into this same job (see below), so the budget covers both suites + one build.
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # P326：改动路径要拿 `github.event.before..github.sha` 真做 diff，所以基点那个提交得在仓里
          # （默认 depth=1 只拉推送末端，基点缺失 → 永远退回全套，改动的省下等于没发生）。
          fetch-depth: 0

      # Self-contained: no registry credentials, no floating image tag. ci/Containerfile pins
      # tmux 3.7b, node 24.19.0, bun 1.3.14, pi 0.86.0 and openspec 1.8.0 (see its header).
      - name: Build the gate image
        run: docker build -f ci/Containerfile -t teamsmith-gates:ci .

      # Read-only workspace mount: the suite only ever writes to its own temp repos and the
      # container's /tmp — a write into the checkout is a bug we want to see, not to allow.
      # `--user` matches the runner (one fixture chmod-000s a file, which root would defeat) and
      # HOME goes to the writable /tmp (the image's /root is not writable for that uid).
      # --pid=host (no --init, which needs a private PID namespace): smoke 10c-② proves that a
      # bare `read` in a background process group of a controlling terminal is stopped by SIGTTIN
      # — the mechanism that made a gate hang for 28 minutes (M25). Under a private PID namespace
      # the kernel answers that read with EIO instead, the fixture cannot reproduce the shape and
      # would have to skip the mechanism (measured in M47: podman private pid ns -> errno=5,
      # --pid=host -> SIGTTIN stop, same image/kernel). Sharing the runner's PID namespace keeps
      # the container faithful to a native run in that one POSIX corner; nothing else changes.
      - name: Gates (pinned container)
        id: gates
        run: |
          # ── P326/B：变动的路径在**宿主侧**算，NUL 分隔读进 bash 数组，作为容器命令的**参数**交进去。──
          # 为什么不走「文件 / 按行读」：路径本身可以含换行，而 git 的默认列表会把引号与反斜杠 C 转义
          # （`-c core.quotePath=false` 只放开非 ASCII）—— 按行读的写法在换行那一条上会给出错误的集合；
          # 工作区是只读挂载，所以也不能把路径写进 checkout 让容器去读。
          # 基点不可解析（workflow_dispatch 没有 before、全零、或不在仓里）→ 一条 ::warning:: + 空数组 →
          # 跑全套：未声明路径或不可解析基点一律落到「多跑」，从不落到「少跑」。
          PATHS=()
          BASE="${{ github.event.before }}"
          TIP="${{ github.sha }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "::warning::changed-path base is unresolvable (base=${BASE:-<none>}) — running the full suite"
          else
            while IFS= read -r -d '' p; do PATHS+=("$p"); done < <(git diff --name-only -z "$BASE" "$TIP")
            echo "changed paths: ${#PATHS[@]} (NUL-separated; passed as the suite's own arguments)"
            [ "${#PATHS[@]}" -eq 0 ] || printf '  %q\n' "${PATHS[@]}"
          fi
          # 失败现场必须能离开容器（D39）：两次尝试（挂载宿主目录到 /tmp）在 runner 上都没能带出文件——
          # 所以改成"容器不自动删（没有 --rm）→ 下一步把现场族拷出来 → 再删容器"。
          # `smoke.sh --keep` 让套件把现场留下（默认失败也删，那行提示不是事实）。
          # P223：`--keep` 真生效的判据在 smoke 自己的 §40（它以前被机器锁的 re-exec 吃掉，
          # 两次 CI 红的工件里就只剩一个锁文件）——这里只负责留下容器。
          # P324：容器拿到的是**显式**临时根（`TMPDIR` = 上面那个 `TEAM_CI_TMP_ROOT`），并且在跑门禁之前
          # 由这一步建出来（显式选的根必须已存在且可写，解析器不替它建）—— 收集步拷的就是这一个目录。
          # P326/B：普通推送跑「产品基线 ∪ 这次改动点到的段」（`--floor --paths "$@"`）；没有可解析基点时
          # 退回全套（命令与改动前逐字一致）。仍是唯一的阻塞步、无 FAST、无 continue-on-error，
          # 披露行（decision= / 未跑清单 / == 选段结果 ==）由套件自己打印 —— 选段运行不冒充全套门禁。
          mkdir -p .ci-artifacts
          docker rm -f teamsmith-gates-run >/dev/null 2>&1 || true
          if [ "${#PATHS[@]}" -gt 0 ]; then
            docker run --name teamsmith-gates-run --pid=host \
              --user "$(id -u):$(id -g)" -e HOME=/tmp -e TMPDIR="$TEAM_CI_TMP_ROOT" \
              -v "$PWD:/work:ro" -w /work \
              teamsmith-gates:ci \
              bash -c 'mkdir -p "$TMPDIR" && openspec validate --all --strict && bash skills/teamsmith/tests/smoke.sh --floor --keep </dev/null --paths "$@"' _ "${PATHS[@]}"
          else
            docker run --name teamsmith-gates-run --pid=host \
              --user "$(id -u):$(id -g)" -e HOME=/tmp -e TMPDIR="$TEAM_CI_TMP_ROOT" \
              -v "$PWD:/work:ro" -w /work \
              teamsmith-gates:ci \
              bash -c 'mkdir -p "$TMPDIR" && openspec validate --all --strict && bash skills/teamsmith/tests/smoke.sh --keep </dev/null'
          fi

      - name: Collect the failure scene
        if: always()
        env:
          GATES_OUTCOME: ${{ steps.gates.outcome }}
        run: |
          # P223：收集步必须**自证现场真的带出来了**（判断逻辑在 ci/collect-scene.sh，本地也能跑）。
          # 为什么要有这道自证：原来这一段是 `docker cp … || true` + `tar … || true`，
          # 一个现场文件都没找到也照样绿 —— 2026-10-04 两次 CI 红的工件里就只有一个 285 字节的锁文件
          # （现场族一个都没有），而这一步「成功」得毫无痕迹。现在的契约：
          #   * 拷贝源是 gate 步钉的那个显式临时根（`--tmp-root`，同一值），不重新算命名空间；
          #   * 只收现场家族（前缀表在脚本里），不收整份临时根，也不把锁文件算成现场；
          #   * 打印找过的路径 + 每个现场族的文件数/字节数；
          #   * 现场族低于阈值 → 这一步红（打印它找过的路径）；gate 绿时不收集（没东西要带），
          #     但容器照旧收掉。
          bash ci/collect-scene.sh --container teamsmith-gates-run --tmp-root "$TEAM_CI_TMP_ROOT" \
            --out .ci-artifacts --gate-outcome "$GATES_OUTCOME"

      - name: Upload the failure scene
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gate-failure-scene
          path: .ci-artifacts
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore

      # P130/B (D60 #1): the performance suite is a **second, independent conclusion** — never a
      # merge gate. It used to be a second job, and each of the two jobs built the same pinned image
      # again, so every run paid two `docker build`s (the quota burn D54 records). Option ① (merge it
      # into this job) was chosen over option ② (keep two jobs + a GHCR-cached image): one runner, one
      # build, no registry credentials or permissions, no `docker pull` that can go stale or fail and
      # silently turn back into a second build. The price — correctness and perf now run sequentially
      # in one job, so a correctness hang consumes this job's timeout before perf starts — is
      # acceptable: perf numbers are recorded by the release-time run and perf gates nothing (the perf
      # suite's own verdicts are non-blocking by design). §B.
      #
      # `if: ${{ !cancelled() }}` keeps the old two-job property that perf still reports when the
      # correctness step failed, without trying to run during an explicit cancellation (GitHub's docs
      # recommend it over `always()`); `continue-on-error: true` is what makes the failure
      # non-blocking: the step shows red with an annotation, later steps run, and the job/workflow
      # conclusion is untouched. The correctness step above has no such tolerance — it stays the hard
      # gate, and the ledger's static checks assert exactly that this stays so.
      - name: Performance suite (pinned container, non-blocking)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          docker run --rm --pid=host \
            --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD:/work:ro" -w /work \
            teamsmith-gates:ci \
            bash -c 'bash skills/teamsmith/tests/perf.sh --in-container --tree /work'
