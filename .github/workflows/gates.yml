name: gates

# The two commands the PM runs on every task branch before merging:
#
#   openspec validate --all --strict && bash skills/teamsmith/tests/smoke.sh
#
# Manual + `main` only (no pull_request trigger): this repository may be private, and Actions minutes are
# billed — the PM's independent `team review <ID> --dir …` run stays the gate that decides a merge. Enable more
# triggers (see docs/team/PUBLISH.md §7) when the repository goes public.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # tmux: the smoke suite drives real windows/panes; perl: the English-prose invariant (smoke §18) fails
      # loudly when perl is missing instead of skipping, so it has to be installed.
      - name: System dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends tmux perl

      # A JS runtime is a doctor-level requirement (node ≥ 20 or bun ≥ 1.3): the pulse console and patrol are
      # a committed Ink bundle. The runner already has node; bun is installed so both supported runtimes exist.
      - name: bun
        uses: oven-sh/setup-bun@v2

      # Unpinned on purpose: the specs must stay valid for the current OpenSpec CLI. Pin it here if you would
      # rather have a red build from an upstream release than silent obsolescence.
      - name: OpenSpec CLI
        run: npm install -g @fission-ai/openspec

      - name: Gates
        run: openspec validate --all --strict && bash skills/teamsmith/tests/smoke.sh
